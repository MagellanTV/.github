# ============================================================================
# CLAUDE PR REVIEW - RULESET ENTRYPOINT
# ============================================================================
# NOT IN USE. The "Require workflows to pass before merging" rule is GitHub
# Enterprise Cloud only, and MagellanTV is on the Team plan. Nothing below
# takes effect until the org upgrades; the per-repo caller is what actually
# runs the review today.
#
# Kept because it costs nothing and is the whole answer if we ever do upgrade.
#
# One side effect worth knowing: this file sits in .github/workflows/ of the
# org repo, so it DOES run on this repository's own pull requests. That is why
# changes to the org config get reviewed without a caller here.
# ----------------------------------------------------------------------------
# If the org moves to Enterprise Cloud, this enforces the review org-wide
# WITHOUT adding any file to the consumer repositories.
#
# Organization settings -> Rulesets -> New ruleset -> Target: repositories
#   Rule: "Require workflows to pass before merging"
#   Source repository: MagellanTV/.github
#   Workflow path:     .github/workflows/org-claude-review-ruleset.yml
#   Ref:               main
#
# Start the ruleset in "Evaluate" mode to confirm the run and the org secret
# resolve correctly before switching it to "Active".
#
# On plans without rulesets, ignore this file and use the per-repo caller
# instead (claude-review.caller.yml). Both paths run the same reusable
# workflow, so the review behaves identically.
# ============================================================================

name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  claude-review:
    uses: MagellanTV/.github/.github/workflows/org-claude-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets: inherit
