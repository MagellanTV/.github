# ============================================================================
# CLAUDE PR REVIEW - PER PROJECT CONFIGURATION
# ============================================================================
# Read by .github/workflows/org-claude-review.yml. The key is the repository
# name, the same convention used by org-team-mapping.yml.
#
# "platform" selects which file under claude-guidelines/ is loaded on top of
# claude-guidelines/_org.md. Adding a project here is optional: anything not
# listed falls back to the defaults below.
# ============================================================================

defaults:
  platform: generic

projects:
  smart-tv:
    platform: smarttv
    description: "Smart TV app - Preact monorepo for webOS, Tizen, Vizio, Vidaa, WhaleTV"

  magellantv_roku:
    platform: roku
    description: "Roku channel - BrightScript and SceneGraph"

  magellantv-android:
    platform: android
    description: "Android and Fire TV app"

  newui-web:
    platform: web
    description: "Website"

  apple-tv:
    platform: apple
    description: "Apple TV app"

  magellantv-ios:
    platform: apple
    description: "iOS app"

  magellantv-encoder:
    platform: backend
    description: "Encoding and media processing services"

  magellantv_dev_ci:
    platform: backend
    description: "CI and deployment tooling"
