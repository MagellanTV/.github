# ============================================================================
# CLAUDE PR REVIEW - PER PROJECT CONFIGURATION
# ============================================================================
# Read by .github/workflows/org-claude-review.yml on every run, from main.
# Editing this file changes the next review in every repository -- no workflow
# change, no consumer-repo change.
#
# The key is the GITHUB REPOSITORY NAME, not the local folder name. They differ
# for some projects (the `magellantv_dev_ci` folder is `magellantv-backend`,
# `newui-web` is `magellantv-web`). The workflow looks the project up by
# `github.event.repository.name`, so a key that does not match the repo silently
# falls back to `defaults`. Same convention as org-team-mapping.yml.
#
# Anything a project does not set falls back to `defaults`.
#
#   platform    which claude-guidelines/<platform>.md is loaded
#   model       passed to --model
#   effort      passed to --effort: low | medium | high | xhigh | max
#   max-turns   turn budget; the ceiling on what one review can spend
#
# On effort: `high` is the balance point between quality and token spend.
# Raise to `xhigh` where a mistake is expensive to walk back -- code that
# ships to devices that update slowly, or that every platform depends on.
# `max` only when correctness outweighs cost outright.
# ============================================================================

defaults:
  platform: generic
  model: claude-sonnet-5
  effort: high
  max-turns: 25

projects:

  # --- Client apps -----------------------------------------------------------

  smart-tv:
    platform: smarttv
    description: "Smart TV app - Preact monorepo for webOS, Tizen, Vizio, Vidaa, WhaleTV"

  magellantv_roku:
    platform: roku
    description: "Roku channel - BrightScript and SceneGraph"

  magellantv-android:
    platform: android
    description: "Android and Fire TV app"

  magellantv-ios:
    platform: apple
    description: "iOS app"

  apple-tv:
    platform: apple
    description: "Apple TV app"

  magellantv-web:
    platform: web
    description: "Website"

  magellan_analytics_kmp:
    platform: android
    description: "Kotlin Multiplatform analytics library - ships into both the Android and Apple apps"

  # --- Services --------------------------------------------------------------

  magellantv-backend:
    platform: backend
    description: "Backend services"

  magellantv-encoder:
    platform: backend
    effort: xhigh
    description: "Encoding and media processing - a bad ladder or manifest change reaches every device at once"

  magellantv-aspera-sync:
    platform: backend
    description: "Aspera transfer sync service"

  # --- Tooling and configuration ---------------------------------------------

  workticket:
    platform: tooling
    description: "Ticket-to-PR workflow tooling"

  FM_.xlsx_to_JSON:
    platform: tooling
    description: "FAST schedule converter - spreadsheet to JSON"

  magellantv-app-config:
    platform: tooling
    description: "Remote app configuration"
